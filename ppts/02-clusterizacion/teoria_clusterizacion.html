<header>Casos Avanzados · Maestría en Ingeniería Analítica</header>
<h1 id="el-caso-de-negocio">El caso de negocio</h1>
<p>Una empresa quiere <strong>entender los perfiles</strong> de sus clientes para diseñar<br />
campañas diferenciadas.</p>
<ul>
<li>Tenemos variables de comportamiento (ingreso, gasto, uso de productos)…</li>
<li>…pero <strong>no hay una etiqueta</strong> que diga a qué grupo pertenece cada cliente.</li>
</ul>
<blockquote>
<p>Objetivo: <strong>descubrir estructura</strong> en los datos sin una variable respuesta.<br />
Esto es <strong>aprendizaje no supervisado</strong>.</p>
</blockquote>
<footer>Tema 2 — Clusterización · basado en <em>ISL</em> cap. 12</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="3" data-paginate="true" data-header="Casos Avanzados · Maestría en Ingeniería Analítica" data-footer="Tema 2 — Clusterización · basado en *ISL* cap. 12" data-theme="default" lang="en-US" data-marpit-pagination="3" style="--paginate:true;--header:Casos Avanzados · Maestría en Ingeniería Analítica;--footer:Tema 2 — Clusterización · basado en *ISL* cap. 12;--theme:default;" data-marpit-pagination-total="16">

<li>Supervisado vs. <strong>no supervisado</strong> — <em>ISL §12.1</em></li>
<li>El reto del aprendizaje no supervisado</li>
<li><strong>K-means:</strong> idea y objetivo — <em>ISL §12.4.1</em></li>
<li>El algoritmo y su naturaleza local</li>
<li><strong>Elegir K:</strong> codo y silhouette</li>
<li>Estandarización y clustering jerárquico — <em>ISL §12.4.2</em></li>
<li>Perfilamiento e interpretación de negocio</li>
<li>Demo en vivo</li>

<ul>
<li>No buscamos predecir, sino <strong>descubrir patrones o subgrupos</strong>.</li>
<li>Dos grandes familias en ISL:
<ul>

<ul>
<li>No podemos calcular <em>accuracy</em> ni RMSE.</li>
<li>No hay validación cruzada directa contra la &quot;verdad&quot;.</li>
<li>La <strong>evaluación es indirecta</strong>: cohesión interna, separación, e<br />
<strong>interpretabilidad de negocio</strong>.</li>
</ul>
<blockquote>
<p>El éxito se juzga por si los segmentos son <strong>accionables</strong>, no por una métrica<br />
única.</p>
</blockquote>

<h1 id="3-el-algoritmo-k-means">3. El algoritmo K-means</h1>
<p>ISL §12.4.1 — iterativo:</p>
<ol>
<li>Asignar aleatoriamente cada observación a uno de los K clusters.</li>
<li><strong>Repetir hasta converger:</strong><br />
a. Calcular el <strong>centroide</strong> de cada cluster.<br />
b. Reasignar cada observación al centroide <strong>más cercano</strong>.</li>
</ol>
<ul>
<li>Garantiza reducir el objetivo en cada paso.</li>
<li>Converge a un <strong>óptimo local</strong> → depende de la inicialización.</li>
</ul>
<footer>Tema 2 — Clusterización · basado en <em>ISL</em> cap. 12</footer>
</section>

<header>Casos Avanzados · Maestría en Ingeniería Analítica</header>
<h1 id="4-naturaleza-local-%E2%86%92-m%C3%BAltiples-inicios">4. Naturaleza local → múltiples inicios</h1>
<ul>
<li>Distintos arranques → distintas soluciones.</li>
<li><strong>Solución:</strong> correr el algoritmo varias veces (<code>n_init</code>) y quedarse con la de<br />
menor variación intra-cluster.</li>
<li>Fijar <code>random_state</code> para <strong>reproducibilidad</strong>.</li>
</ul>
<blockquote>
<p>En la práctica, <code>KMeans(n_init=10, random_state=...)</code>.</p>
</blockquote>
<footer>Tema 2 — Clusterización · basado en <em>ISL</em> cap. 12</footer>
</section>

<h1 id="5-%C2%BFcu%C3%A1ntos-clusters--m%C3%A9todo-del-codo">5. ¿Cuántos clusters? — Método del codo</h1>
<p>No hay un K &quot;verdadero&quot;; lo elegimos con criterios:</p>
<ul>
<li>Graficar la <strong>inercia</strong> (variación intra-cluster) frente a K.</li>
<li>Buscar el <strong>&quot;codo&quot;</strong>: el punto donde añadir clusters ya <strong>no reduce mucho</strong> la<br />
inercia.</li>
</ul>

<header>Casos Avanzados · Maestría en Ingeniería Analítica</header>
<h1 id="6-la-escala-importa">6. La escala importa</h1>
<p>K-means usa <strong>distancias</strong> → variables en escalas grandes dominan.</p>
<ul>
<li>Un balance de miles pesaría más que una frecuencia entre 0 y 1.</li>
<li><strong>Solución:</strong> estandarizar (<code>StandardScaler</code>, media 0, desviación 1) antes de<br />
clusterizar.</li>
</ul>
<blockquote>
<p>ISL insiste: la decisión de <strong>escalar</strong> cambia por completo los grupos<br />
resultantes (§12.4.2).</p>
</blockquote>
<footer>Tema 2 — Clusterización · basado en <em>ISL</em> cap. 12</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-paginate="true" data-header="Casos Avanzados · Maestría en Ingeniería Analítica" data-footer="Tema 2 — Clusterización · basado en *ISL* cap. 12" data-theme="default" lang="en-US" data-marpit-pagination="12" style="--paginate:true;--header:Casos Avanzados · Maestría en Ingeniería Analítica;--footer:Tema 2 — Clusterización · basado en *ISL* cap. 12;--theme:default;" data-marpit-pagination-total="16">
<header>Casos Avanzados · Maestría en Ingeniería Analítica</header>
<h1 id="6-alternativa-clustering-jer%C3%A1rquico">6. Alternativa: clustering jerárquico</h1>
<p>ISL §12.4.2 — no exige fijar K de antemano.</p>
<ul>
<li>Construye un <strong>dendrograma</strong> (árbol de fusiones sucesivas).</li>
<li>Se &quot;corta&quot; a la altura deseada para obtener K grupos.</li>
<li>Depende de la <strong>medida de enlace</strong> (linkage) y de la distancia.</li>
</ul>
<blockquote>
<p>Mención breve: útil cuando se quiere explorar la estructura a varias<br />
resoluciones. Hoy nos centramos en K-means.</p>
</blockquote>
<footer>Tema 2 — Clusterización · basado en <em>ISL</em> cap. 12</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-paginate="true" data-header="Casos Avanzados · Maestría en Ingeniería Analítica" data-footer="Tema 2 — Clusterización · basado en *ISL* cap. 12" data-theme="default" lang="en-US" data-marpit-pagination="13" style="--paginate:true;--header:Casos Avanzados · Maestría en Ingeniería Analítica;--footer:Tema 2 — Clusterización · basado en *ISL* cap. 12;--theme:default;" data-marpit-pagination-total="16">
<header>Casos Avanzados · Maestría en Ingeniería Analítica</header>
<h1 id="7-perfilamiento--dar-sentido-a-los-clusters">7. Perfilamiento — dar sentido a los clusters</h1>
<p>Encontrar los grupos es solo la mitad; hay que <strong>interpretarlos</strong>.</p>
<ul>
<li>Calcular la <strong>media de cada variable por cluster</strong>.</li>
<li>Traducir a <strong>etiquetas de negocio</strong>: &quot;premium de alto gasto&quot;,<br />
